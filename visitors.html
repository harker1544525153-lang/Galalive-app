<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALA LIVE - 访客记录</title>
        <link rel="stylesheet" href="css/visitors.css">

</head>
<body>
<div class="app">
    <!-- Header -->
    <div class="header">
        <div class="header-top">
            <div class="back-btn" onclick="goBack()">←</div>
            <div class="header-title">👀 访客记录</div>
            <div style="width:24px;"></div>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-item">
            <div class="stat-value">128</div>
            <div class="stat-label">今日访客</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">1,256</div>
            <div class="stat-label">本周访客</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">5,689</div>
            <div class="stat-label">本月访客</div>
        </div>
    </div>

    <!-- Visitor List -->
    <div class="visitor-list">
        <div class="date-label">今天</div>
        
        <div class="visitor-item">
            <div class="visitor-avatar">🦊</div>
            <div class="visitor-info">
                <div class="visitor-name">快乐小兔</div>
                <div class="visitor-time">14:30 访问了您的主页</div>
            </div>
            <button class="visitor-action" onclick="followUser()">关注</button>
        </div>

        <div class="visitor-item">
            <div class="visitor-avatar">🐻</div>
            <div class="visitor-info">
                <div class="visitor-name">阳光小熊</div>
                <div class="visitor-time">13:15 访问了您的主页</div>
            </div>
            <button class="visitor-action" onclick="followUser()">关注</button>
        </div>

        <div class="date-label">昨天</div>

        <div class="visitor-item">
            <div class="visitor-avatar">🐱</div>
            <div class="visitor-info">
                <div class="visitor-name">可爱猫咪</div>
                <div class="visitor-time">20:00 访问了您的主页</div>
            </div>
            <button class="visitor-action" onclick="followUser()">关注</button>
        </div>

        <div class="visitor-item">
            <div class="visitor-avatar">🐶</div>
            <div class="visitor-info">
                <div class="visitor-name">忠诚小狗</div>
                <div class="visitor-time">18:30 访问了您的主页</div>
            </div>
            <button class="visitor-action" onclick="followUser()">关注</button>
        </div>
    </div>

    <!-- Bottom Tab -->
    <div class="bottom-tab">
        <div class="tab-item" onclick="navigate(this,'home.html')">
            <span class="tab-icon">🏠</span>
            首页
        </div>
        <div class="tab-item" onclick="navigate(this,'short-video.html')">
            <span class="tab-icon">🎬</span>
            视频
        </div>
        <div class="tab-item" onclick="navigate(this,'ranking.html')">
            <span class="tab-icon">🏆</span>
            排行
        </div>
        <div class="tab-item" onclick="navigate(this,'messages.html')">
            <span class="tab-icon">💬</span>
            消息
        </div>
        <div class="tab-item active" onclick="navigate(this,'profile.html')">
            <span class="tab-icon">👤</span>
            我的
        </div>
    </div>
</div>

    <script src="js/visitors.js"></script>

</body>
</html>
