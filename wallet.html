<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALA LIVE - 钱包</title>
        <link rel="stylesheet" href="css/wallet.css">

</head>
<body>
<div class="app">
    <!-- Header -->
    <div class="header">
        <div class="header-top">
            <div class="header-back" onclick="goBack()">←</div>
            <div class="header-title">💰 我的钱包</div>
            <div class="header-record" onclick="showRecords()">交易记录</div>
        </div>
    </div>

    <!-- Balance Card -->
    <div class="balance-card">
        <div class="balance-label">钻石余额</div>
        <div class="balance-value">💎 12,580</div>
        <div class="balance-actions">
            <div class="balance-btn" onclick="showDeposit()">充值</div>
            <div class="balance-btn" onclick="showWithdraw()">提现</div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab(this)">钻石充值</div>
        <div class="tab" onclick="switchTab(this)">收益提现</div>
    </div>

    <!-- Recharge Section -->
    <div class="recharge-section">
        <div class="section-title">选择充值金额</div>
        <div class="recharge-grid">
            <div class="recharge-item active" onclick="selectRecharge(this)">
                <div class="recharge-diamond">💎</div>
                <div class="recharge-amount">60</div>
                <div class="recharge-price">¥6.00</div>
            </div>
            <div class="recharge-item" onclick="selectRecharge(this)">
                <div class="recharge-diamond">💎</div>
                <div class="recharge-amount">300</div>
                <div class="recharge-price">¥30.00</div>
                <div class="recharge-bonus">+30钻石</div>
            </div>
            <div class="recharge-item" onclick="selectRecharge(this)">
                <div class="recharge-diamond">💎</div>
                <div class="recharge-amount">980</div>
                <div class="recharge-price">¥98.00</div>
                <div class="recharge-bonus">+100钻石</div>
            </div>
            <div class="recharge-item" onclick="selectRecharge(this)">
                <div class="recharge-diamond">💎</div>
                <div class="recharge-amount">1,980</div>
                <div class="recharge-price">¥198.00</div>
                <div class="recharge-bonus">+250钻石</div>
            </div>
            <div class="recharge-item" onclick="selectRecharge(this)">
                <div class="recharge-diamond">💎</div>
                <div class="recharge-amount">3,280</div>
                <div class="recharge-price">¥328.00</div>
                <div class="recharge-bonus">+500钻石</div>
            </div>
            <div class="recharge-item" onclick="selectRecharge(this)">
                <div class="recharge-diamond">💎</div>
                <div class="recharge-amount">6,480</div>
                <div class="recharge-price">¥648.00</div>
                <div class="recharge-bonus">+1,200钻石</div>
            </div>
        </div>
    </div>

    <!-- Pay Methods -->
    <div class="pay-section">
        <div class="section-title">选择支付方式</div>
        <div class="pay-method active" onclick="selectPayMethod(this)">
            <div class="pay-icon">💳</div>
            <div class="pay-info">
                <div class="pay-name">微信支付</div>
                <div class="pay-desc">推荐使用，安全快捷</div>
            </div>
            <div class="pay-radio"></div>
        </div>
        <div class="pay-method" onclick="selectPayMethod(this)">
            <div class="pay-icon">💰</div>
            <div class="pay-info">
                <div class="pay-name">支付宝</div>
                <div class="pay-desc">支付便捷，快速到账</div>
            </div>
            <div class="pay-radio"></div>
        </div>
        <div class="pay-method" onclick="selectPayMethod(this)">
            <div class="pay-icon">📱</div>
            <div class="pay-info">
                <div class="pay-name">Apple Pay</div>
                <div class="pay-desc">快捷支付，安全可靠</div>
            </div>
            <div class="pay-radio"></div>
        </div>
    </div>

    <!-- Recharge Button -->
    <div class="recharge-btn" onclick="doRecharge()">立即充值 ¥6.00</div>

    <!-- Bottom Tab -->
    <div class="bottom-tab">
        <div class="tab-item" onclick="navigate(this,'home.html')">
            <span class="tab-icon">🏠</span>
            首页
        </div>
        <div class="tab-item" onclick="navigate(this,'short-video.html')">
            <span class="tab-icon">🎬</span>
            视频
        </div>
        <div class="tab-item" onclick="navigate(this,'ranking.html')">
            <span class="tab-icon">🏆</span>
            排行
        </div>
        <div class="tab-item" onclick="navigate(this,'messages.html')">
            <span class="tab-icon">💬</span>
            消息
        </div>
        <div class="tab-item active" onclick="navigate(this,'profile.html')">
            <span class="tab-icon">👤</span>
            我的
        </div>
    </div>
</div>

    <script src="js/wallet.js"></script>

</body>
</html>
