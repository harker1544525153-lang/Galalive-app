<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALA LIVE - 设置</title>
        <link rel="stylesheet" href="css/settings.css">

</head>
<body>
<div class="app">
    <!-- Header -->
    <div class="header">
        <div class="back-btn" onclick="goBack()">←</div>
        <div class="header-title">设置</div>
    </div>

    <!-- User Card -->
    <div class="user-card" onclick="editProfile()">
        <div class="user-avatar">👤</div>
        <div class="user-info">
            <div class="user-name">用户昵称</div>
            <div class="user-id">ID: 10086</div>
        </div>
        <div class="edit-profile">编辑资料</div>
    </div>

    <!-- Account Section -->
    <div class="section">
        <div class="section-title">账号</div>
        <div class="section-list">
            <div class="list-item" onclick="showPage('account')">
                <span class="list-icon">🔐</span>
                <span class="list-text">账号与安全</span>
                <span class="list-arrow">›</span>
            </div>
            <div class="list-item" onclick="showPage('privacy')">
                <span class="list-icon">🔒</span>
                <span class="list-text">隐私设置</span>
                <span class="list-arrow">›</span>
            </div>
            <div class="list-item" onclick="showPage('blacklist')">
                <span class="list-icon">🚫</span>
                <span class="list-text">黑名单</span>
                <span class="list-arrow">›</span>
            </div>
        </div>
    </div>

    <!-- Notifications Section -->
    <div class="section">
        <div class="section-title">通知</div>
        <div class="section-list">
            <div class="list-item">
                <span class="list-icon">🔔</span>
                <span class="list-text">开播通知</span>
                <div class="toggle active" onclick="toggleSwitch(this)"></div>
            </div>
            <div class="list-item">
                <span class="list-icon">💬</span>
                <span class="list-text">私信通知</span>
                <div class="toggle active" onclick="toggleSwitch(this)"></div>
            </div>
            <div class="list-item">
                <span class="list-icon">❤</span>
                <span class="list-text">点赞通知</span>
                <div class="toggle" onclick="toggleSwitch(this)"></div>
            </div>
            <div class="list-item">
                <span class="list-icon">💬</span>
                <span class="list-text">评论通知</span>
                <div class="toggle" onclick="toggleSwitch(this)"></div>
            </div>
        </div>
    </div>

    <!-- General Section -->
    <div class="section">
        <div class="section-title">通用</div>
        <div class="section-list">
            <div class="list-item" onclick="showPage('play')">
                <span class="list-icon">▶</span>
                <span class="list-text">播放设置</span>
                <span class="list-arrow">›</span>
            </div>
            <div class="list-item" onclick="clearCache()">
                <span class="list-icon">🗑️</span>
                <span class="list-text">清除缓存</span>
                <span class="list-value">128.5MB</span>
                <span class="list-arrow">›</span>
            </div>
            <div class="list-item" onclick="showPage('language')">
                <span class="list-icon">🌐</span>
                <span class="list-text">语言</span>
                <span class="list-value">简体中文</span>
                <span class="list-arrow">›</span>
            </div>
        </div>
    </div>

    <!-- About Section -->
    <div class="section">
        <div class="section-title">关于</div>
        <div class="section-list">
            <div class="list-item" onclick="showPage('about')">
                <span class="list-icon">ℹ️</span>
                <span class="list-text">关于GALA LIVE</span>
                <span class="list-arrow">›</span>
            </div>
            <div class="list-item" onclick="showPage('agreement')">
                <span class="list-icon">📄</span>
                <span class="list-text">用户协议</span>
                <span class="list-arrow">›</span>
            </div>
            <div class="list-item" onclick="showPage('privacy-policy')">
                <span class="list-icon">📋</span>
                <span class="list-text">隐私政策</span>
                <span class="list-arrow">›</span>
            </div>
            <div class="list-item" onclick="showPage('feedback')">
                <span class="list-icon">💌</span>
                <span class="list-text">意见反馈</span>
                <span class="list-arrow">›</span>
            </div>
            <div class="list-item" onclick="showPage('help')">
                <span class="list-icon">❓</span>
                <span class="list-text">帮助中心</span>
                <span class="list-arrow">›</span>
            </div>
        </div>
    </div>

    <!-- Logout -->
    <div class="logout-btn" onclick="doLogout()">退出登录</div>

    <!-- Bottom Tab -->
    <div class="bottom-tab">
        <div class="tab-item" onclick="navigate(this,'home.html')">
            <span class="tab-icon">🏠</span>
            首页
        </div>
        <div class="tab-item" onclick="navigate(this,'short-video.html')">
            <span class="tab-icon">🎬</span>
            视频
        </div>
        <div class="tab-item" onclick="navigate(this,'ranking.html')">
            <span class="tab-icon">🏆</span>
            排行
        </div>
        <div class="tab-item" onclick="navigate(this,'messages.html')">
            <span class="tab-icon">💬</span>
            消息
        </div>
        <div class="tab-item active" onclick="navigate(this,'profile.html')">
            <span class="tab-icon">👤</span>
            我的
        </div>
    </div>
</div>

    <script src="js/settings.js"></script>

</body>
</html>
